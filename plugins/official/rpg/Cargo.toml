[package]
name = "chattree-rpg-plugin"
version = "1.0.0"
edition = "2021"
authors = ["Chattree Core Team <team@chattree.app>"]
description = "Simulador de Rol de Texto interactivo y motor de aventura determinista para Chattree"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
