[package]
name = "chattree-plugin-starter"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <developer@example.com>"]
description = "Starter template for building Chattree WebAssembly plugins in Rust."

[lib]
crate-type = ["cdylib"]

[dependencies]
# No mandatory runtime dependencies. Plugins run in WebAssembly linear memory.

[profile.release]
opt-level = "z"     # Optimize for smallest binary size
lto = true          # Enable Link-Time Optimization
codegen-units = 1
panic = "abort"
strip = true        # Strip symbols to minimize binary size
